# 门禁规则。阈值集中在这一处 —— 改标准改这里，不改进代码。
#
# 每一档 severity 的取舍写在 metrics/gate.py 的模块 docstring 里。

perf:
  thresholds:
    # 绝对阈值：兜底线，防止"基线自己已经烂了还一路绿灯"
    error_rate_max: 0.01      # 1%
    p95_ms_max: 300.0         # 本机环境下的绝对值；换机器要重设
    # 样本量：低于这个数，分位数没有意义（P99 在 100 个样本里就是最大值）
    min_total_requests: 2000
    # 长尾比：>4 倍说明有偶发的锁等待/慢查询
    p99_over_p95_max: 4.0

  # 基线劣化的容忍带 —— 本文件里唯一"必须按机器实测"的一组值。
  #
  # 用 `python platform_cli.py noise --rounds 5` 在本机量出来再填，
  # 不要照抄。它最初是拍脑袋的 3%，实测立刻打脸：
  # 同一份代码、同一配置连跑两轮，P95 从 105.9ms 变到 110.2ms（+4.1%），
  # 门禁判「拦住」—— 一次没有任何代码变慢的假阳性。
  #
  # 本机（Windows 11 / 12 核）实测 5 轮 P95：
  #   [128.5, 127.5, 137.9, 130.8, 132.2] ms
  #   极差 8.16%，单轮最大偏离均值 4.95% → 取约 2 倍余量 = 10%
  #
  # 换机器/换容器后应当重跑 noise 重新定。论证见 docs/度量口径.md 第二节。
  tolerance:
    degradation_pct: 0.10      # 延迟类（P95/P99/mean/max）涨幅超过它算劣化
    rps_degradation_pct: 0.10  # RPS 方向相反：掉超过它算劣化

probe:
  # 性能探针：故意保留的 N+1 实现。
  # 阈值取自实测 —— 记录在 docs/已知问题.md 的 P-1，口径论证在 docs/度量口径.md。
  # 20k 数据量下实测 agg ≈ 38ms / n1 ≈ 219ms（约 5.7×），
  # 阈值留出余量到 150ms / 10×，避免机器抖动导致误红。
  slow_report_p95_ms_max: 150.0
  n1_over_agg_max: 10.0

suite:
  min_pass_rate: 1.0          # 功能用例必须全绿
  max_flaky_cases: 2          # flaky 预算：超过就要处理，但不拦流水线
