# 门禁规则。阈值集中在这一处 —— 改标准改这里，不改进代码。
#
# 每一档 severity 的取舍写在 metrics/gate.py 的模块 docstring 里。

perf:
  thresholds:
    # 绝对阈值：兜底线，防止"基线自己已经烂了还一路绿灯"
    error_rate_max: 0.01      # 1%
    p95_ms_max: 300.0         # 本机环境下的绝对值；换机器要重设
    # 样本量：低于这个数，分位数没有意义（P99 在 100 个样本里就是最大值）
    min_total_requests: 2000
    # 长尾比：>4 倍说明有偶发的锁等待/慢查询
    p99_over_p95_max: 4.0

  # 基线劣化的容忍带 —— 本文件里唯一"必须按机器实测"的一组值。
  #
  # 用 `python platform_cli.py noise --rounds 5` 在本机量出来再填，
  # 不要照抄。它最初是拍脑袋的 3%，实测立刻打脸：
  # 同一份代码、同一配置连跑两轮，P95 从 105.9ms 变到 110.2ms（+4.1%），
  # 门禁判「拦住」—— 一次没有任何代码变慢的假阳性。
  #
  # 本机（Windows 11 / 12 核）实测 5 轮 P95：
  #   [128.5, 127.5, 137.9, 130.8, 132.2] ms
  #   均值 131.4ms，样本标准差 4.09ms → 单轮 CV = 3.11%
  #
  # 关键一步：R3 判的是**两轮之差**，不是单轮相对均值。
  # 两轮独立同分布，差值序列的方差是单轮的两倍，于是
  #   CV_diff = √2 × CV = 1.414 × 3.11% ≈ 4.40%
  # 10% / 4.40% ≈ **2.27σ**。
  #
  # 也就是说：这个值是"两轮差值噪声的约 2.3 倍标准差"，
  # 能压掉绝大多数（但非全部）纯噪声假阳性 —— 它是一次**工程折中**，
  # 不是统计保证（2.27σ 对应约 1.2% 的单尾假阳性率，不是 0）。
  # 极差 8.16% 只是同一批数据的另一种描述，不构成推导：真正决定
  # 假阳性率的是差值分布的标准差，所以上面按 CV_diff 写。
  #
  # 想要更硬的边界只有两条路，都不在本文件的自动范围内：
  # 多跑几轮把 CV 量准，或把容忍带放大到 3σ ≈ 13.2%（代价是漏报更多）。
  #
  # 换机器/换容器后应当重跑 noise 重新定。论证见 docs/度量口径.md 第二节。
  tolerance:
    degradation_pct: 0.10      # 延迟类（P95/P99/mean/max）涨幅超过它算劣化
    rps_degradation_pct: 0.10  # RPS 方向相反：掉超过它算劣化

  # 可比性：两轮的配置差多少就认为"不是同一套实验"。
  # items 从 5000 变成 5100 是同一个实验，从 5254 变成 900 是另一个实验。
  # report_mode / scenario 一律要求**精确相等**，不走这个容忍带。
  # 5% 不是统计推导出来的，是一条工程线；改动前先读 docs/度量口径.md。
  comparability:
    tolerance: 0.05

probe:
  # 性能探针：故意保留的 N+1 实现。
  # 阈值取自实测 —— 记录在 docs/已知问题.md 的 P-1，口径论证在 docs/度量口径.md。
  # 20k 数据量下实测 agg ≈ 41ms / n1 ≈ 317ms（约 7.8×）；口径 = 复用连接 + 热身 3 次
  # + 15 样本取中位 + 每格独立复测 3 轮取中位（测量日期 2026-10-13，
  # 6 次独立整轮复测的本机极差：agg 37–54ms、n1 253–404ms）。
  # 注意：这里的 41/317 是**单请求中位数**，与 platform_cli probe 输出的
  # P95（另一次连续压测、单机线程池口径）不是同一口径，不要互相换算。
  # 阈值留出余量到 150ms / 10×，避免机器抖动导致误红：
  # 实测的单请求比值 7.8× 距 10× 已不远，但 probe 路径判的是压测引擎的 P95 比值
  # （CI 上是 81.6×），因此这条阈值仍然合理 —— 见 docs/已知问题.md P-1。
  slow_report_p95_ms_max: 150.0
  n1_over_agg_max: 10.0

suite:
  min_pass_rate: 1.0          # 功能用例必须全绿
  max_flaky_cases: 2          # flaky 预算：超过就要处理，但不拦流水线
  # flaky 判据：判定用"稳定度"（多数派占比）而不是"失败次数"——
  # 一个跑 200 次失败 3 次的用例比跑 8 次失败 3 次的用例健康得多。
  # 样本不足 min_runs 时不下结论（跳过而非判 flaky）。
  flaky_min_runs: 6
  flaky_stability_max: 0.85
