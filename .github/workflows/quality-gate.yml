name: quality-gate

# 这个工作流本身就是一个"质量门禁"的示例：
# 它不做部署，只做一件事 —— 判定这次提交能不能合并，然后拦住或放行。
#
# 关键设计：**判定逻辑不在 YAML 里，在平台里**。
# 这里只负责调用和读退出码。把阈值散落在 CI 配置里是
# 「门禁规则」最常见的退化方式：改一次阈值要翻三个仓库。
#
# 静态检查（ruff/mypy）的配置同样不在 YAML 里，在 pyproject.toml。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

  # 每周一次夜间回归。
  #
  # 为什么需要它：`on: push` 只在**有人改动**时才跑，而性能劣化最典型的
  # 形态恰恰是"代码没动，环境变了"—— runner 镜像升级、依赖间接升级、
  # 宿主机噪声变大。这类变化不会触发任何 push，于是基线悄悄失效，
  # 直到某天有人推了个无关的 commit，门禁突然红，而所有人都认为
  # "是这次改动引入的"。定时跑就是为了把"环境漂移"和"代码劣化"分开。
  #
  # 03:17 UTC = 北京 11:17：避开整点（GitHub 的定时任务在整点最拥挤，
  # 延迟可达十几分钟，而延迟会让"跑在同一时段"这个前提不成立）。
  schedule:
    - cron: "17 3 * * 1"

# 同一分支上只保留最后一次运行：新的 push 会取消上一轮还在跑的。
# 但**定时运行不参与取消**（`github.ref` 对 schedule 是默认分支）——
# 否则一次 push 会把还没跑完的夜间回归掐掉，那份数据就永远丢了。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------- #
  # 静态检查：与"跑起来对不对"无关，只看"写起来对不对"。
  # 单独成 job 而不是塞进 platform-tests：它几秒钟就出结果，
  # 失败了没必要等 40 秒的用例跑完才知道。
  # ------------------------------------------------------------------------- #
  lint:
    name: 静态检查（ruff + mypy）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 依赖清单一致性（requirements*.txt ↔ pyproject.toml）
        run: python scripts/check_deps_sync.py

      # ruff 的规则集在 pyproject.toml 的 [tool.ruff.lint].select，
      # 不在这里 —— 阈值与口径只有一处事实源。
      - name: ruff
        run: python -m ruff check .

      # 格式检查是**阻塞项**：38 个文件在本机实测已全部格式化，
      # 没有理由再让它"只报告"——只报告的格式检查等于没有格式检查，
      # 因为没人会因为一条黄色警告去改空白。
      # 与 fullstack-test-framework 的 `lint` job 保持同一口径。
      - name: ruff 格式检查（阻塞，不自动改）
        run: python -m ruff format --check .

      # mypy 的严格度与分阶段豁免清单在 pyproject.toml 的 [tool.mypy]。
      # 注意：这份配置里有一份**显式登记的类型债清单**（5 个模块），
      # 不是"全绿"。详见 README「类型检查」。
      - name: mypy
        run: python -m mypy

  # ------------------------------------------------------------------------- #
  # 依赖安全扫描。
  #
  # **刻意设为非阻塞**（continue-on-error）。理由不是"不想修"：
  # pip-audit 的结论依赖漏洞库快照，同一个 commit 今天绿明天红是常态。
  # 把它做成阻塞项，唯一的长期结果是"有人加 `|| true`"，门禁照样失效，
  # 只是没人再看得见。所以：**结论留在 step summary 里，由人决定要不要处理**。
  #
  # `pip-audit -r <file>` 在本机沙箱跑不了：它会建临时 venv 并调 ensurepip，
  # 而沙箱拒绝（PermissionError: [WinError 5]），所以这一步**只在 CI 可验证**。
  # 但 `pip-audit --local` 不需要建 venv，本机可跑（实测 21 个已知漏洞 / 7 个包）。
  # 另已修一个独立缺陷：`-r` 读含中文注释的 requirements*.txt 时，
  # 内嵌的 pip_requirements_parser 会回退到 cp936 抛 UnicodeDecodeError；
  # 已通过给 requirements.txt / requirements-dev.txt 补 PEP263 声明修复。
  # ------------------------------------------------------------------------- #
  security-audit:
    name: 依赖漏洞扫描（pip-audit，非阻塞）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: 扫描 requirements.txt
        continue-on-error: true
        run: |
          python -m pip install -r requirements.txt
          python -m pip_audit --requirement requirements.txt --format markdown \
            --output audit-report.md || echo "PIP_AUDIT_FOUND=1" >> "$GITHUB_ENV"

      - name: 把结论写进 step summary
        if: always()
        run: |
          {
            echo "## 依赖漏洞扫描（pip-audit）"
            echo ""
            echo "> 非阻塞步骤：结论仅供人工判断，不影响构建状态。"
            echo ""
            if [ -f audit-report.md ]; then
              cat audit-report.md
            else
              echo "扫描未产出报告（安装失败或网络问题），本步骤不代表通过。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit-report.md
          retention-days: 30
          if-no-files-found: ignore

  platform-tests:
    name: 平台自身测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 缓存键跟着依赖文件走：requirements.txt 一改，缓存自动失效。
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑用例并入库（结果写进 quality.db，供后续趋势/flaky 分析）
        run: |
          python platform_cli.py suite --label platform-tests

      # suite 子命令失败即退出码 1，CI 自动红。
      # 上一步同时完成了"跑测试 + 入库 + 套件门禁"三件事，
      # 不再需要单独的 pytest 步骤 —— 避免同一份用例跑两遍。

      # --------------------------------------------------------------------- #
      # 覆盖率门槛。
      #
      # 为什么是"另一条命令"而不是塞进 suite 的 extra 参数：
      # suite 会把结果写进 quality.db 并判定套件门禁，而覆盖率是
      # **另一类证据**（代码有没有被测到 ≠ 用例过没过）。让它们各自
      # 拥有独立的退出码与独立的日志段，失败时能一眼看出是哪一类。
      #
      # 为什么口径是 `--cov=<业务目录>` 而不是 `--cov=.`：
      # 见 pyproject.toml 里 [tool.coverage] 段的注释 —— 含 tests/ 的
      # 数字会被自己稀释。门槛值 40 与 pyproject 的 fail_under 是同一常量。
      #
      # ⚠️ 必须写成重复的 `--cov=`，不能写 `--cov=a,b`：
      # 本版本（pytest-cov 7.1.0）下逗号写法**静默收集不到数据**，
      # 报告出 0% 而不是报错。
      # --------------------------------------------------------------------- #
      - name: 覆盖率门槛（业务代码 ≥ 40%）
        run: |
          python -m pytest tests/ -q \
            --cov=bench --cov=metrics --cov=sut --cov=dashboard --cov=platform_cli \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传结果库与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-db-and-reports
          path: |
            quality.db
            reports/
          retention-days: 14

      # 失败通知：不需要任何 secret。
      # 写进 step summary 而不是发 webhook —— 后者要配 secret，
      # 而一个"引用了不存在的 secret"的通知步骤会让整个 job 报错，
      # 于是通知本身成了新的故障源。
      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## ❌ 平台自身测试失败"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| 运行 | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "失败原因看上方「跑用例并入库」或「覆盖率门槛」步骤的日志。"
            echo "历史趋势用 \`python platform_cli.py trend --label platform-tests\` 查看。"
          } >> "$GITHUB_STEP_SUMMARY"

  perf-gate:
    name: 性能门禁（基线劣化）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: platform-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 基线从**仓库里的快照文件**（`baselines/<label>.json`）恢复，不再用 artifact。
      #
      # 之前这里下载 artifact `quality-db-and-reports` —— 而那个 artifact 是
      # **同一个 run 自己**的 platform-tests job 刚上传的（`if: always()`）。
      # 跨 job 拿不到上一轮的库，`baselines` 表恒空，于是线上每一次 R3 都打印
      # 「未设置基线，跳过劣化对比」：门禁的核心价值（抓"慢慢变慢"）
      # 在 CI 里从来没生效过，而报告里那一行长得像"通过"。
      #
      # 注意：**不要**在 CI 里自动把当前结果设成基线。
      # 基线只能由人显式设置（`baseline set`），再 `baseline export` 出快照
      # 提交进仓库 —— 谁在哪次提交里动了基线，`git log` 能回答。
      # 否则"慢慢变慢"会被每一轮自己批准 —— 门禁就失效了。
      #
      # 导入失败（文件损坏 / 格式版本不认识）会让这一步退出码非 0：
      # 一条读不对的基线必须吵闹，绝不能安静地放行。
      - name: 恢复基线（人显式提交的快照）
        run: |
          if [ -f baselines/ci-perf.json ]; then
            python platform_cli.py baseline import --label ci-perf
          else
            echo "::warning::没有 baselines/ci-perf.json —— 本轮 R3 未做对比（不是'比过了没劣化'）"
            {
              echo "## ⚠️ 本轮没有基线快照，R3 未做劣化对比"
              echo ""
              echo "门禁结果里 R3 会标 \`[SKIP]\`：**跳过**不等于**通过**。"
              echo "基线只能由人显式设置（CI 不会自己设）："
              echo ""
              echo '```bash'
              echo "python platform_cli.py run --label ci-perf --set-baseline"
              echo "python platform_cli.py baseline export --label ci-perf   # 提交 baselines/ci-perf.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 环境分层：CI 默认（不设 PERF_ENV）行为与引入分层之前逐字节一致，
      # 所以这里**不需要**设 PERF_ENV。要用档案时显式注入即可，
      # 例如下面这行取消注释就跑 staging 档案（结果库落在 var/staging/）：
      #   env: { PERF_ENV: staging }
      #
      # `--r3-advisory`：R3 照旧做对比、照旧打印劣化项与百分比、照旧入库，
      # 但**不拦人**。为什么：容忍带 10% 是在开发机上按 P95 的轮间波动定的，
      # 而 runner 上同一份配置连跑几轮，p99 / max 的轮间波动远大于该容忍带
      # （原始数字见 docs/已知问题.md P-16）。这不是"放宽阈值"——阈值一个字没动，
      # 改的是"这条判据在当前环境下算不算数"。R1（错误率）与 R2（绝对 P95）
      # 仍然 blocking，绝对劣化依然拦得住。
      - name: 跑压测并判定门禁
        run: |
          # 退出码 0 = 放行，1 = 拦住（存在 blocking 未通过）
          python platform_cli.py run \
            --label ci-perf \
            --items 20000 \
            --step-users 10 20 \
            --step-duration 8 \
            --r3-advisory

      - name: 上传本轮报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: reports/
          retention-days: 14

      # 把**这一轮在 runner 上量出来的**库交出来给人。
      #
      # 基线必须由人显式重设（CI 绝不会自己设），但"重设"需要一个可信的数据源：
      # 拿开发机的数字去当 CI 的基线，就变成跨机器比较 —— 见 P-15 记的代价。
      # 所以这里只做一件事：把 runner 自己的测量结果上传，由人下载后执行
      # `baseline set --run-id <本轮>` + `baseline export`，再把快照提交进仓库。
      # **CI 不改基线，只提供证据。**
      - name: 上传本轮测量库（供人重设基线用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-db
          path: quality.db
          retention-days: 14

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## ❌ 性能门禁拦住（基线劣化）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 运行 | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "这不是 CI 抖动，是**判定结果**：退出码 1 表示存在 blocking 未通过。"
            echo ""
            echo "注意基线可比性：对比只在 \`items\` / 并发梯度 / 场景一致时成立。"
            echo "本次 run 的实测值与逐条规则结论见 artifact \`perf-report\`。"
            echo ""
            echo "> 若确认是环境漂移（runner 换型号等）而非代码劣化，"
            echo "> 需要人显式重设基线 —— 不要为了让它变绿而调阈值。"
          } >> "$GITHUB_STEP_SUMMARY"

  n1-probe:
    name: N+1 缺陷探针
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: platform-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 这条是"缺陷探针"而不是"性能门禁"：
      # /api/reports/slow-by-supplier 的 n1 实现是**故意保留的缺陷**，
      # 这个 job 存在的意义是**反复证明门禁真的会红**（红队演练）。
      #
      # 如果哪天它变绿了，说明缺陷被修了 —— 那时应当
      # 更新 docs/已知问题.md 并把这条探针改成断言"已经修复"。
      - name: 探针（预期失败，用于证明门禁有效）
        id: probe
        continue-on-error: true
        run: |
          python platform_cli.py probe --label ci-n1-probe --items 20000 --users 4 --duration 8

      - name: 探针结论摘要
        if: always()
        run: |
          {
            echo "## N+1 缺陷探针（agg vs n1）"
            echo ""
            echo "预期结果是**拦住**（退出码 1）—— 这条 job 的意义就是证明门禁会红。"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 探针退出码 | \`${{ steps.probe.outcome }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo ""
            echo "若退出码为 \`success\`（放行），说明缺陷可能已被修复 ——"
            echo "此时应当更新 \`docs/已知问题.md\` 并把本条改成断言"已修复"。"
            echo "**不要**默默接受一次绿：一条永远绿的探针等于没有探针。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 在线看板：把 dashboard 渲染成一页静态 HTML 推到 gh-pages。
  #
  # 为什么值得单独一个 job：
  # 这个仓库最需要"看趋势"的地方是 P95 随时间怎么走、基线被哪一轮顶上去的、
  # 哪条用例在 flaky 名单上待了多久 —— 这些在本地 `platform_cli.py serve`
  # 里都看得到，但**只有本机看得到**。审阅者不会 clone 下来跑压测，
  # 于是"有看板"这件事在仓库外面等于不存在。
  #
  # 三个刻意的决定：
  # 1. 复用 `render_snapshot()`，不另写一套渲染 —— 线上看板与本地 `serve`
  #    必须是**同一份代码**渲染的，否则会出现"两边说法不一致"这种最难查的
  #    分裂（本地 p95 是绿的，页面上是红的，谁对？）。
  # 2. 带上历史库。CI 每轮都是全新检出，库里只有本轮那几行；不带历史，
  #    趋势图永远只有一个点，等于没有趋势。所以先把 gh-pages 上那份
  #    `history.db` 取下来合并，再导出，再把合并后的库推回去。
  # 3. push main / 手动触发才发布。PR 的内容未必进 main，往 gh-pages 推
  #    等于提前发布一个可能被否决的版本。
  pages:
    name: 在线看板（gh-pages）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: perf-gate
    # 门禁**红了也要**更新看板：红的那些轮次恰恰最需要被看见
    # （"这次为什么红了"、"是慢慢变慢还是突然崩"）。默认的 needs 语义是
    # 上游成功才跑，那会让看板在出事的时候停止更新 —— 正好和它存在的
    # 目的相反。
    #
    # 但 platform-tests 挂了时不发布：那时 perf-gate 根本没跑，
    # 库里没有本轮数据，发出去只会让人以为"这一轮是绿的"。
    if: always() && needs.perf-gate.result != 'skipped'
    # 看板发不出去不该让整条流水线变红：门禁已经在上一个 job 判过了，
    # 这里的失败是"发布"失败，不是"质量"失败。但会被摘要显式标出来。
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 取回历史结果库
        id: hist
        # gh-pages 第一次发布时还不存在 —— 那是正常状态，不是错误。
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .history
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show origin/gh-pages:history.db > .history/history.db 2>/dev/null \
              && echo "取到历史库：$(du -h .history/history.db | cut -f1)" \
              || echo "gh-pages 上没有 history.db（首次发布）"
          else
            echo "远端还没有 gh-pages 分支（首次发布）"
          fi

      - name: 跑一轮压测产生本轮数据
        # 这一轮的数据只给看板用：门禁在 perf-gate 里已经判过了，
        # 这里要的是"这次提交在图上落一个点"。参数取小值，别让看板 job
        # 变成第二个 45 分钟的长跑。
        run: |
          python platform_cli.py run --label ci-dashboard --items 20000 \
            --step-users 10 20 --step-duration 5 --r3-advisory || true

      - name: 导出静态看板（并入历史）
        run: |
          python platform_cli.py report --out reports/dashboard \
            --merge-db .history/history.db

      - name: 发布到 gh-pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp reports/dashboard/index.html "$publish_dir"/
          # 把合并后的库一起发布：下一轮 CI 靠它画出连续的趋势。
          # 只发布这一个文件，不发布 reports/ 下的其它产物 —— gh-pages
          # 只承载"给人看的页面 + 画趋势所需的那一份数据"。
          cp quality.db "$publish_dir"/history.db
          cd "$publish_dir"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: 更新性能看板（${GITHUB_SHA::7}）"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: 看板摘要
        if: always()
        run: |
          {
            echo "## 在线看板"
            echo ""
            if [ -f reports/dashboard/index.html ]; then
              echo "- 页面大小：$(du -h reports/dashboard/index.html | cut -f1)"
              echo "- 发布状态：\`${{ job.status }}\`（PR 上不发布）"
              echo "- 地址：https://$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z' | sed 's|/|.github.io/|')/"
            else
              echo "**没有生成页面** —— 导出步骤失败了，看上面的日志。"
            fi
            echo ""
            echo "历史库：${{ steps.hist.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
