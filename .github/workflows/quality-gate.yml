name: quality-gate

# 这个工作流本身就是一个"质量门禁"的示例：
# 它不做部署，只做一件事 —— 判定这次提交能不能合并，然后拦住或放行。
#
# 关键设计：**判定逻辑不在 YAML 里，在平台里**。
# 这里只负责调用和读退出码。把阈值散落在 CI 配置里是
# 「门禁规则」最常见的退化方式：改一次阈值要翻三个仓库。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  platform-tests:
    name: 平台自身测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑用例并入库（结果写进 quality.db，供后续趋势/flaky 分析）
        run: |
          python platform_cli.py suite --label platform-tests

      # suite 子命令失败即退出码 1，CI 自动红。
      # 上一步同时完成了"跑测试 + 入库 + 套件门禁"三件事，
      # 不再需要单独的 pytest 步骤 —— 避免同一份用例跑两遍。

      - name: 上传结果库与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-db-and-reports
          path: |
            quality.db
            reports/
          retention-days: 14

  perf-gate:
    name: 性能门禁（基线劣化）
    runs-on: ubuntu-latest
    needs: platform-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 基线从 artifacts 或独立存储恢复。
      # 注意：**不要**在 CI 里自动把当前结果设成基线。
      # 基线只能由人显式设置（`baseline set`），否则
      # "慢慢变慢"会被每一轮自己批准 —— 门禁就失效了。
      - name: 恢复基线
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: quality-db-and-reports

      - name: 跑压测并判定门禁
        run: |
          # 退出码 0 = 放行，1 = 拦住（存在 blocking 未通过）
          python platform_cli.py run \
            --label ci-perf \
            --items 20000 \
            --step-users 10 20 \
            --step-duration 8

      - name: 上传本轮报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: reports/
          retention-days: 14

  n1-probe:
    name: N+1 缺陷探针
    runs-on: ubuntu-latest
    needs: platform-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 这条是"缺陷探针"而不是"性能门禁"：
      # /api/reports/slow-by-supplier 的 n1 实现是**故意保留的缺陷**，
      # 这个 job 存在的意义是**反复证明门禁真的会红**（红队演练）。
      #
      # 如果哪天它变绿了，说明缺陷被修了 —— 那时应当
      # 更新 docs/已知问题.md 并把这条探针改成断言"已经修复"。
      - name: 探针（预期失败，用于证明门禁有效）
        continue-on-error: true
        run: |
          python platform_cli.py probe --label ci-n1-probe --items 20000 --users 4 --duration 8
