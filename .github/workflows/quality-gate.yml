name: quality-gate

# 这个工作流本身就是一个"质量门禁"的示例：
# 它不做部署，只做一件事 —— 判定这次提交能不能合并，然后拦住或放行。
#
# 关键设计：**判定逻辑不在 YAML 里，在平台里**。
# 这里只负责调用和读退出码。把阈值散落在 CI 配置里是
# 「门禁规则」最常见的退化方式：改一次阈值要翻三个仓库。
#
# 静态检查（ruff/mypy）的配置同样不在 YAML 里，在 pyproject.toml。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

  # 每周一次夜间回归。
  #
  # 为什么需要它：`on: push` 只在**有人改动**时才跑，而性能劣化最典型的
  # 形态恰恰是"代码没动，环境变了"—— runner 镜像升级、依赖间接升级、
  # 宿主机噪声变大。这类变化不会触发任何 push，于是基线悄悄失效，
  # 直到某天有人推了个无关的 commit，门禁突然红，而所有人都认为
  # "是这次改动引入的"。定时跑就是为了把"环境漂移"和"代码劣化"分开。
  #
  # 03:17 UTC = 北京 11:17：避开整点（GitHub 的定时任务在整点最拥挤，
  # 延迟可达十几分钟，而延迟会让"跑在同一时段"这个前提不成立）。
  schedule:
    - cron: "17 3 * * 1"

# 同一分支上只保留最后一次运行：新的 push 会取消上一轮还在跑的。
# 但**定时运行不参与取消**（`github.ref` 对 schedule 是默认分支）——
# 否则一次 push 会把还没跑完的夜间回归掐掉，那份数据就永远丢了。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------- #
  # 静态检查：与"跑起来对不对"无关，只看"写起来对不对"。
  # 单独成 job 而不是塞进 platform-tests：它几秒钟就出结果，
  # 失败了没必要等 40 秒的用例跑完才知道。
  # ------------------------------------------------------------------------- #
  lint:
    name: 静态检查（ruff + mypy）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 依赖清单一致性（requirements*.txt ↔ pyproject.toml）
        run: python scripts/check_deps_sync.py

      # ruff 的规则集在 pyproject.toml 的 [tool.ruff.lint].select，
      # 不在这里 —— 阈值与口径只有一处事实源。
      - name: ruff
        run: python -m ruff check .

      - name: ruff 格式检查（只报告，不自动改）
        run: python -m ruff format --check .
        continue-on-error: true

      # mypy 的严格度与分阶段豁免清单在 pyproject.toml 的 [tool.mypy]。
      # 注意：这份配置里有一份**显式登记的类型债清单**（5 个模块），
      # 不是"全绿"。详见 README「类型检查」。
      - name: mypy
        run: python -m mypy

  # ------------------------------------------------------------------------- #
  # 依赖安全扫描。
  #
  # **刻意设为非阻塞**（continue-on-error）。理由不是"不想修"：
  # pip-audit 的结论依赖漏洞库快照，同一个 commit 今天绿明天红是常态。
  # 把它做成阻塞项，唯一的长期结果是"有人加 `|| true`"，门禁照样失效，
  # 只是没人再看得见。所以：**结论留在 step summary 里，由人决定要不要处理**。
  #
  # 本仓库的开发沙箱装不上 pip-audit（拒绝 ensurepip，报
  # PermissionError: [WinError 5]），所以这一步**只在 CI 可验证**。
  # ------------------------------------------------------------------------- #
  security-audit:
    name: 依赖漏洞扫描（pip-audit，非阻塞）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: 扫描 requirements.txt
        continue-on-error: true
        run: |
          python -m pip install -r requirements.txt
          python -m pip_audit --requirement requirements.txt --format markdown \
            --output audit-report.md || echo "PIP_AUDIT_FOUND=1" >> "$GITHUB_ENV"

      - name: 把结论写进 step summary
        if: always()
        run: |
          {
            echo "## 依赖漏洞扫描（pip-audit）"
            echo ""
            echo "> 非阻塞步骤：结论仅供人工判断，不影响构建状态。"
            echo ""
            if [ -f audit-report.md ]; then
              cat audit-report.md
            else
              echo "扫描未产出报告（安装失败或网络问题），本步骤不代表通过。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit-report.md
          retention-days: 30
          if-no-files-found: ignore

  platform-tests:
    name: 平台自身测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 缓存键跟着依赖文件走：requirements.txt 一改，缓存自动失效。
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑用例并入库（结果写进 quality.db，供后续趋势/flaky 分析）
        run: |
          python platform_cli.py suite --label platform-tests

      # suite 子命令失败即退出码 1，CI 自动红。
      # 上一步同时完成了"跑测试 + 入库 + 套件门禁"三件事，
      # 不再需要单独的 pytest 步骤 —— 避免同一份用例跑两遍。

      # --------------------------------------------------------------------- #
      # 覆盖率门槛。
      #
      # 为什么是"另一条命令"而不是塞进 suite 的 extra 参数：
      # suite 会把结果写进 quality.db 并判定套件门禁，而覆盖率是
      # **另一类证据**（代码有没有被测到 ≠ 用例过没过）。让它们各自
      # 拥有独立的退出码与独立的日志段，失败时能一眼看出是哪一类。
      #
      # 为什么口径是 `--cov=<业务目录>` 而不是 `--cov=.`：
      # 见 pyproject.toml 里 [tool.coverage] 段的注释 —— 含 tests/ 的
      # 数字会被自己稀释。门槛值 40 与 pyproject 的 fail_under 是同一常量。
      #
      # ⚠️ 必须写成重复的 `--cov=`，不能写 `--cov=a,b`：
      # 本版本（pytest-cov 7.1.0）下逗号写法**静默收集不到数据**，
      # 报告出 0% 而不是报错。
      # --------------------------------------------------------------------- #
      - name: 覆盖率门槛（业务代码 ≥ 40%）
        run: |
          python -m pytest tests/ -q \
            --cov=bench --cov=metrics --cov=sut --cov=dashboard --cov=platform_cli \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传结果库与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-db-and-reports
          path: |
            quality.db
            reports/
          retention-days: 14

      # 失败通知：不需要任何 secret。
      # 写进 step summary 而不是发 webhook —— 后者要配 secret，
      # 而一个"引用了不存在的 secret"的通知步骤会让整个 job 报错，
      # 于是通知本身成了新的故障源。
      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## ❌ 平台自身测试失败"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| 运行 | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "失败原因看上方「跑用例并入库」或「覆盖率门槛」步骤的日志。"
            echo "历史趋势用 \`python platform_cli.py trend --label platform-tests\` 查看。"
          } >> "$GITHUB_STEP_SUMMARY"

  perf-gate:
    name: 性能门禁（基线劣化）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: platform-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 基线从 artifacts 或独立存储恢复。
      # 注意：**不要**在 CI 里自动把当前结果设成基线。
      # 基线只能由人显式设置（`baseline set`），否则
      # "慢慢变慢"会被每一轮自己批准 —— 门禁就失效了。
      - name: 恢复基线
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: quality-db-and-reports

      # 环境分层：CI 默认（不设 PERF_ENV）行为与引入分层之前逐字节一致，
      # 所以这里**不需要**设 PERF_ENV。要用档案时显式注入即可，
      # 例如下面这行取消注释就跑 staging 档案（结果库落在 var/staging/）：
      #   env: { PERF_ENV: staging }
      - name: 跑压测并判定门禁
        run: |
          # 退出码 0 = 放行，1 = 拦住（存在 blocking 未通过）
          python platform_cli.py run \
            --label ci-perf \
            --items 20000 \
            --step-users 10 20 \
            --step-duration 8

      - name: 上传本轮报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: reports/
          retention-days: 14

      - name: 失败摘要
        if: failure()
        run: |
          {
            echo "## ❌ 性能门禁拦住（基线劣化）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 运行 | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "这不是 CI 抖动，是**判定结果**：退出码 1 表示存在 blocking 未通过。"
            echo ""
            echo "注意基线可比性：对比只在 \`items\` / 并发梯度 / 场景一致时成立。"
            echo "本次 run 的实测值与逐条规则结论见 artifact \`perf-report\`。"
            echo ""
            echo "> 若确认是环境漂移（runner 换型号等）而非代码劣化，"
            echo "> 需要人显式重设基线 —— 不要为了让它变绿而调阈值。"
          } >> "$GITHUB_STEP_SUMMARY"

  n1-probe:
    name: N+1 缺陷探针
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: platform-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 这条是"缺陷探针"而不是"性能门禁"：
      # /api/reports/slow-by-supplier 的 n1 实现是**故意保留的缺陷**，
      # 这个 job 存在的意义是**反复证明门禁真的会红**（红队演练）。
      #
      # 如果哪天它变绿了，说明缺陷被修了 —— 那时应当
      # 更新 docs/已知问题.md 并把这条探针改成断言"已经修复"。
      - name: 探针（预期失败，用于证明门禁有效）
        id: probe
        continue-on-error: true
        run: |
          python platform_cli.py probe --label ci-n1-probe --items 20000 --users 4 --duration 8

      - name: 探针结论摘要
        if: always()
        run: |
          {
            echo "## N+1 缺陷探针（agg vs n1）"
            echo ""
            echo "预期结果是**拦住**（退出码 1）—— 这条 job 的意义就是证明门禁会红。"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 探针退出码 | \`${{ steps.probe.outcome }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo ""
            echo "若退出码为 \`success\`（放行），说明缺陷可能已被修复 ——"
            echo "此时应当更新 \`docs/已知问题.md\` 并把本条改成断言"已修复"。"
            echo "**不要**默默接受一次绿：一条永远绿的探针等于没有探针。"
          } >> "$GITHUB_STEP_SUMMARY"
