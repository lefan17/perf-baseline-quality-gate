# 工程化外壳的单一配置入口。
#
# 与仓库既有风格一致：**阈值与口径不散落在 CI YAML 里**。
# 所以 mypy / ruff / coverage 的配置集中在这里，workflow 只负责
# 调用命令、读退出码 —— 跟「门禁判定逻辑在平台里，不在 YAML 里」是同一个道理。
#
# 本文件**不包含** [tool.pytest.ini_options]：仓库已有 pytest.ini，
# 而 pytest 的配置优先级是 pytest.ini > pyproject.toml，两处并存必然互相遮蔽。
# 保持 pytest.ini 为唯一事实源，这里只留一句说明。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-baseline-quality-gate"
version = "0.1.0"
description = "性能与稳定性基线平台 + 质量度量与 CI 门禁平台"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Lefan Ma", email = "128964809+lefan17@users.noreply.github.com" }]
keywords = ["performance", "baseline", "regression", "quality-gate", "pytest"]

# 依赖的**唯一事实来源仍是 requirements.txt**（全部 ==，版本取实测值）。
# 这里逐字镜像它，只为让 `pip install .` 能工作；两处一旦漂移，
# scripts/check_deps_sync.py 会在 pre-commit 与 CI 里直接报错。
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "requests==2.34.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# 与本仓库的 requirements-dev.txt 逐字一致（同样由 check_deps_sync.py 校验）。
#
# ruff 与 mypy 的版本是**本机实测装出来的**，所以能钉死；
# pre-commit 与 pip-audit 在本项目的开发沙箱里装不上
# （沙箱拒绝 ensurepip，报 PermissionError: [WinError 5] 拒绝访问），
# 版本未经实测 → **刻意不写版本号**，而不是编一个看起来专业的数字。
# 首次在可联网机器上装好后，应当立刻把它们钉死，理由同 requirements.txt 头部。
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pip-tools==7.6.2",
    "pre-commit",
    "pip-audit",
]

[project.urls]
Repository = "https://github.com/lefan17/perf-baseline-quality-gate"

# --------------------------------------------------------------------------- #
# 打包范围：仓库里有一批**故意不该进 wheel** 的东西
# --------------------------------------------------------------------------- #
[tool.setuptools]
py-modules = ["platform_cli"]
packages = ["bench", "dashboard", "metrics", "sut"]

# --------------------------------------------------------------------------- #
# ruff：静态检查
# --------------------------------------------------------------------------- #
# 为什么 line-length = 120 而不是默认 88 / 也不是「足够大到全过」的 140：
#   实测同一份代码 —— 88 报 195 条 E501、100 报 37、110 报 9、**120 报 3**、140 报 0。
#   这个仓库的注释密度很高，且大量对齐全角中文（`≤`、`——`、`×`）。
#   定 140 会让这条规则彻底失效（等于没开）；定 88/100 会产出上百条
#   与「代码对不对」无关的噪声。120 是本仓库真实的排版习惯，
#   剩下的 3 条超出者不在本次允许改动的文件里（metrics/analysis.py、metrics/store.py），
#   所以**不把 E501 放进 select**，并在下面用 per-file-ignores 的方式登记同一类债。
#
# 为什么 select 只开这一组，而不是 `ALL`：
#   实测 `--select ALL` 在这个仓库报 **3146** 条，其中 **1641 条是 RUF001/002/003**
#   （ambiguous-unicode-character-*）。这个项目通篇中文注释与中文报告，
#   这三条规则会把「中文全角标点」全部判成问题 —— 对中文项目是纯粹的噪声。
#   所以：**只开能长期保持零误报、且真能抓 bug 的族**，其余按族如实登记在 README 里。
#
# 为什么是 ignore F541/B905 而不是修掉：
#   实测 F541 只剩 metrics/gate.py 一处、B905 只剩 metrics/gate.py 两处，
#   而 metrics/gate.py 属于本次「只动工程化外壳」的边界外文件。
#   三个站点用一条 per-file-ignores 登记，比在 5 个文件里撒 `# noqa` 更可审计。
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "reports", "ci_logs", "docs/incident-encoding-20261010"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle 的报错子集（不含 E501，理由见上）
    "F",                # pyflakes：未定义名/未用导入
    "B",                # flake8-bugbear
    "C4",               # 推导式写法
    "N",                # 命名规范
    "FURB",             # refurb 的现代化建议
    "PIE",              # 无意义代码
    "RUF015", "RUF022", # RUF 里与中文无关的两条（打开 RUF 全族会引入上面那 1642 条噪声）
    "A",                # 内建名遮蔽
    "T10",              # 调试器残留
    "LOG",              # logging 用法
    "INT",              # gettext 误用
    "ICN",              # import 别名约定
    "ERA",              # 注释掉的代码
    "TID",              # 相对导入约定
    "SLOT",             # __slots__ 冲突
]

[tool.ruff.lint.per-file-ignores]
# 本次边界外文件里已登记的风格债，见 README「已知静态检查债」。
#   F541 ×1 + B905 ×2 在 metrics/gate.py（门禁判定文件，本次不许动）
#   F541 ×4 在 platform_cli.py（本次只许改它的环境分层读取部分）
# 合计 7 条，全部是「写起来不整洁」而不是「写错了」：
# B905 的两处 zip() 长度不匹配时会静默截断，属于**真问题**，
# 但修它要动门禁判定路径 → 记为待办而不是就地改。
"metrics/gate.py" = ["F541", "B905"]
"platform_cli.py" = ["F541"]

[tool.ruff.lint.isort]
known-first-party = ["bench", "dashboard", "metrics", "sut"]

# --------------------------------------------------------------------------- #
# mypy：类型检查
# --------------------------------------------------------------------------- #
# 为什么是「能过的合理严格度」而不是更强：实测全仓只有 5 个错误、分布在 5 个文件，
# 其中 **4 个落在本次允许改动的文件之外**（metrics/gate.py、metrics/analysis.py、
# dashboard/app.py、sut/server_ctl.py）。宁可把这份债**显式列出来**，
# 也不用 `# type: ignore` 在源码里撒点 —— 撒点之后没人知道还剩多少真问题。
[tool.mypy]
python_version = "3.12"
files = ["bench", "metrics", "sut", "dashboard", "platform_cli.py"]
exclude = ["^\\.venv/", "^tests/"]

# 必需：仓库里 bench/、metrics/ 等都是「无 __init__.py 的 src 布局同名包」，
# 不加这个 flag 会直接报
#   bench: error: Duplicate module named "__main__" (also at "metrics")
#   Found 1 error in 1 file (errors prevented further checking)
# 也就是**一行有效结论都没有**。
explicit_package_bases = true
# 第三方库（fastapi/uvicorn/jsonschema）没有 stub，缺它是噪声不是信号。
ignore_missing_imports = true

check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = false

# --------------------------------------------------------------------------- #
# 类型债清单（**按错误码逐模块**豁免，不是整模块豁免）
# --------------------------------------------------------------------------- #
# 全仓实测只有 5 个错误、分布在 5 个文件。它们全部是「变量被推断成过窄/过宽的类型」，
# 修起来都是改注解或加一次 None 判断 —— 但 4 个落在本次「只动工程化外壳」的边界外：
#   metrics/gate.py     → 改它要碰门禁判定路径（明令不许动）
#   metrics/analysis.py → 同上，报告口径
#   dashboard/app.py    → 看板
#   sut/server_ctl.py   → 进程回收路径，改错会留下僵尸 uvicorn
# 第 5 个在 platform_cli.py，但本次对它只授权了「环境分层所需的配置读取」改动，
# 而这个类型问题在改动之前就存在（:362 行附近），修它属于顺手改业务逻辑。
#
# ## 为什么不用 `ignore_errors = true` 一了百了
#
# 因为我试过，而它**掩盖了真实的绿色**：写成整模块豁免之后
# `python -m mypy` 报 `Success: no issues found in 15 source files`，
# 看上去全仓零错误 —— 但实际上这 5 个错误一个都没消失，只是没人再看得见。
# 这正是这个仓库最反对的那种「静默放行」（见 docs/已知问题.md）。
#
# 所以每一条都**精确到错误码 + 模块**：豁免的是「这一个已知问题」，
# 而不是「这个文件从此不必检查」。同一模块里将来任何别的类型错误
# 都会照样让 CI 变红。
#
# ## 精度的代价（如实记录）
#
# disable_error_code 是按**错误码**过滤的，它无法只豁免「第 362 行那一个」。
# 所以上面 5 条各自的副作用是：该模块里同类的其它新错误也不会报。
# 这是刻意接受的取舍 —— 相比整模块豁免已经精确了一个数量级，
# 而要做到逐行需要 `# type: ignore[code]`，那就等于往源码里撒点。
#
# ## 归零路径
#
# 为这 5 处单独开一个 PR，把错误清零后**逐条删掉**本段对应块。
# 删掉时不需要动其它任何东西 —— 这正是按错误码写的好处。
[[tool.mypy.overrides]]
module = ["metrics.gate"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["metrics.analysis"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["dashboard.app"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["sut.server_ctl"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["platform_cli"]
disable_error_code = ["assignment"]

# --------------------------------------------------------------------------- #
# coverage：覆盖率门槛
# --------------------------------------------------------------------------- #
# 口径：**只统计业务代码**，把 tests/ 自身排除在外。
#   实测（命令见 README「项目自身质量」）：
#     `--cov=.`                                        → 2597 stmts / 1046 miss / 60%
#     `--cov=bench --cov=metrics --cov=sut --cov=dashboard --cov=platform_cli`
#                                                      → 1829 stmts / 1043 miss / 43%
#   含 tests/ 的 60% 是虚高的：tests/ 自己也进了分母且几乎全被执行，
#   拿它给自己打分等于用分母稀释问题。**门槛按 43% 这条口径定。**
# 门槛 40：低于实测 43，留 3 个点余量。
#   不给 43 —— 门槛贴着实测值时，任何一次无关的代码改动都会让 CI 变红，
#   而「稳定变红的门槛」唯一的结局是所有人学会忽略它（README 第 ⑤ 条踩坑）。
#   也不给 30 以下 —— 那对一个 43% 的仓库存量等于没有门槛。
#   余量只有 3 个点，是因为本次新增的 scripts/ 与 platform_cli.py 的环境分层代码
#   本身也是被测对象（新代码不是测试覆盖的，分母就变大）。
#   CI 里的 --cov-fail-under=40 与这里的 fail_under 是同一个常量，改就要一起改。
# 刻意的**反直觉**选择：这里不写 `source = [...]`。
#
# 写它会污染一个已被文档引用的数字。实测（同一份代码、同一台机器）：
#     `pytest tests/ -q --cov=.`                       → 2597 stmts / 1046 miss / 60%
#     再加上 `source = [...]` 之后同一命令               → 2590 stmts / 1040 miss / 61%
# coverage 会把 `source` 与 `--cov=` 取并集，于是 README 里
# 「60%」这个实测值就不再能被人一条命令复现 —— 而「数字可复现」
# 是这个仓库的第一卖点。所以**测量范围只能由命令行显式给出**，
# 不让配置文件在背后改口径。
#
# 顺带记一个坑：`--cov=a,b` 的逗号写法在本版本（pytest-cov 7.1.0）
# 下**静默收集不到任何数据**，报告出 0% 而不是报错。
# 必须写成重复的 `--cov=a --cov=b`。CI 与 docker-compose.yml 都用后者。
# 另一个同样的反直觉选择：这里**也不写 exclude_also**。
#
# 我原本加了三条 exclude_also（TYPE_CHECKING / NotImplementedError / __main__），
# 理由是「这些行结构上跑不到」。实测证明这个理由是错的、代价也不小：
#     `--cov=.` 默认配置                    → 2597 stmts / 1046 miss / 60%
#     `--cov=.` + exclude_also             → 2590 stmts / 1040 miss / 61%
# 它把 README 里写的 60% 变成了 61%，而且**没有任何一行代码发生变化**。
# 一个为了"让数字更好看"而改数字的配置，正是这个仓库在 docs/诚实边界.md
# 里反复警告的那类做法。所以：**报告口径保持原样**，
# 想排除的分支要排除就在源码里用 `# pragma: no cover` 显式标注（可审计）。
[tool.coverage.report]
fail_under = 40
show_missing = true
